<div class="auth-wrapper auth-v2 anmar-auth-screen" [class.anmar-page-rtl]="isArabic">
  <div class="auth-inner anmar-auth-inner">
    <div class="anmar-auth-container">
      <div class="anmar-auth-form-side">
        <div class="anmar-login-card" [class.anmar-auth-rtl]="isArabic">
          <div class="anmar-login-topbar">
            <button type="button" class="btn btn-outline-primary btn-sm anmar-lang-btn" (click)="toggleLanguage()">
              {{ t.language }}
            </button>
          </div>

          <div class="text-center mb-3">
            <img src="assets/images/logo/shap.png" alt="ANMAR" class="anmar-login-logo mb-2" />
            <h2 class="card-title font-weight-bold mb-1">{{ t.title }}</h2>
            <p class="card-text mb-0">{{ t.subtitle }}</p>
          </div>

          <ngb-alert [type]="'danger'" [dismissible]="false" *ngIf="error" class="mb-2">
            <div class="alert-body">
              <p class="mb-0">{{ error }}</p>
            </div>
          </ngb-alert>

          <form class="auth-login-form mt-2" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
            <div class="form-group">
              <label class="form-label" for="login-email">{{ t.emailLabel }}</label>
              <input
                id="login-email"
                type="text"
                formControlName="email"
                class="form-control"
                [ngClass]="{ 'is-invalid': submitted && f.email.errors }"
                [placeholder]="t.emailPlaceholder"
                aria-describedby="login-email"
                [dir]="isArabic ? 'rtl' : 'ltr'"
                autofocus
                tabindex="1"
              />
              <div *ngIf="submitted && f.email.errors" class="invalid-feedback">
                <div *ngIf="f.email.errors.required">{{ t.emailRequired }}</div>
                <div *ngIf="f.email.errors.email">{{ t.emailInvalid }}</div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="login-password">{{ t.passwordLabel }}</label>
              <div class="input-group input-group-merge form-password-toggle">
                <input
                  id="login-password"
                  [type]="passwordTextType ? 'text' : 'password'"
                  formControlName="password"
                  class="form-control form-control-merge"
                  [ngClass]="{ 'is-invalid error': submitted && f.password.errors }"
                  [placeholder]="t.passwordPlaceholder"
                  aria-describedby="login-password"
                  [dir]="isArabic ? 'rtl' : 'ltr'"
                  tabindex="2"
                />
                <div class="input-group-append">
                  <span class="input-group-text cursor-pointer">
                    <i
                      class="feather font-small-4"
                      [ngClass]="{
                        'icon-eye-off': passwordTextType,
                        'icon-eye': !passwordTextType
                      }"
                      (click)="togglePasswordTextType()"
                    ></i>
                  </span>
                </div>
              </div>
              <div
                *ngIf="submitted && f.password.errors"
                class="invalid-feedback"
                [ngClass]="{ 'd-block': submitted && f.password.errors }"
              >
                <div *ngIf="f.password.errors.required">{{ t.passwordRequired }}</div>
              </div>
            </div>

            <div class="form-group d-flex align-items-center justify-content-between flex-wrap mb-2">
              <div class="custom-control custom-checkbox">
                <input class="custom-control-input" id="remember-me" type="checkbox" tabindex="3" />
                <label class="custom-control-label" for="remember-me">{{ t.remember }}</label>
              </div>
            </div>

            <button [disabled]="loading" class="btn btn-primary btn-block anmar-login-btn" tabindex="4" rippleEffect>
              <span *ngIf="loading" class="spinner-border spinner-border-sm mr-1"></span>
              {{ t.submit }}
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
